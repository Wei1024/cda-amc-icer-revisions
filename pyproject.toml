[project]
name = "icer-revisions"
version = "0.1.0"
description = "How and why CDA-AMC revises sponsor ICERs: extraction and modelling of Canadian reimbursement reviews, 2020-2025."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "requests>=2.34.2",
]

[project.scripts]
icer = "icer_revisions.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]  # PyMuPDF SWIG bindings
